<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COMPY Monitor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
    body { background: #2d3528; color: #c8f58e; padding: 24px; }
    header { display: flex; align-items: center; gap: 15px; border-bottom: 3px solid #c8f58e; padding-bottom: 12px; margin-bottom: 24px; }
    .logo { width: 42px; height: 42px; border: 2px solid #c8f58e; border-radius: 50%; display: grid; place-items: center; font-weight: bold; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card, .panel { background: #21271e; border: 1px solid #3f4d37; border-radius: 8px; padding: 18px; }
    .card { text-align: center; }
    .gauge { width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 10px; display: grid; place-items: center; font-size: 20px; font-weight: bold;
             background: radial-gradient(#21271e 58%, transparent 60%), conic-gradient(#c8f58e var(--p), #171c14 0); }
    .bottom { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
    .controls { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; align-items: center; }
    input, button { background: #3c4735; color: #c8f58e; border: 1px solid #58694e; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
    button.active, button:hover { background: #c8f58e; color: #21271e; font-weight: bold; }
    .row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid #2d3528; }
    .bar { flex: 1; height: 6px; background: #171c14; border-radius: 3px; overflow: hidden; }
    .bar div { height: 100%; background: #c8f58e; }
    .alert { background: #384232; border-left: 4px solid #ff7b6b; padding: 10px; border-radius: 4px; margin-top: 10px; }
    .alert small { display: block; color: #98b382; margin-bottom: 4px; }
    @media (max-width: 720px) { .bottom { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <header>
    <h1>COMPY</h1>
    <div class="logo">SYS</div>
    <button style="margin-left:auto" onclick="updateStats(true)">+ SPIKE</button>
  </header>

  <section class="grid-4" id="gauges">
    <div class="card"><div class="gauge" id="g-cpu" style="--p:50%">50%</div><h3>CPU</h3></div>
    <div class="card"><div class="gauge" id="g-ram" style="--p:65%">65%</div><h3>RAM</h3></div>
    <div class="card"><div class="gauge" id="g-disk" style="--p:20%">20%</div><h3>DISK</h3></div>
    <div class="card"><div class="gauge" id="g-net" style="--p:15%">15%</div><h3>NETWORK</h3></div>
  </section>

  <section class="bottom">
    <div class="panel">
      <h2>HISTORY</h2>
      <div class="controls">
        <span>FROM</span> <input type="time" value="10:00"> <input type="date" value="2026-11-16">
        <span>TO</span> <input type="time" value="23:59"> <input type="date" value="2026-11-19">
      </div>
      <div class="controls" id="filters">
        <span>FILTER:</span>
        <button class="active" onclick="setFilter('ALL', this)">ALL</button>
        <button onclick="setFilter('CPU', this)">CPU</button>
        <button onclick="setFilter('RAM', this)">RAM</button>
        <button onclick="setFilter('DISK', this)">DISK</button>
        <button onclick="setFilter('NET', this)">NET</button>
      </div>
      <div id="logs">
        <div class="row" data-m="CPU"><span>11:59</span><div class="bar"><div style="width:50%"></div></div><strong>CPU</strong></div>
        <div class="row" data-m="RAM"><span>11:11</span><div class="bar"><div style="width:65%"></div></div><strong>RAM</strong></div>
        <div class="row" data-m="DISK"><span>10:50</span><div class="bar"><div style="width:20%"></div></div><strong>DISK</strong></div>
        <div class="row" data-m="NET"><span>10:35</span><div class="bar"><div style="width:15%"></div></div><strong>NET</strong></div>
      </div>
    </div>

    <div class="panel">
      <h2>ALERTS</h2>
      <div id="alerts">
        <div class="alert"><small>10:30, NOV 16 2026</small>CPU Spiked to <strong>94%</strong></div>
      </div>
    </div>
  </section>

  <script>
    let filter = 'ALL';

    function setFilter(type, btn) {
      filter = type;
      document.querySelectorAll('#filters button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.row').forEach(r => r.style.display = (filter === 'ALL' || r.dataset.m === filter) ? 'flex' : 'none');
    }

    function updateStats(spike = false) {
      const vals = {
        cpu: spike ? 95 : Math.floor(Math.random() * 60) + 20,
        ram: Math.floor(Math.random() * 40) + 40,
        disk: Math.floor(Math.random() * 20) + 15,
        net: Math.floor(Math.random() * 50) + 10
      };
      for (const [k, v] of Object.entries(vals)) {
        const el = document.getElementById('g-' + k);
        el.style.setProperty('--p', v + '%');
        el.textContent = v + '%';
      }
      if (spike) {
        const time = new Date().toTimeString().slice(0, 5);
        document.getElementById('alerts').insertAdjacentHTML('afterbegin', `<div class="alert"><small>${time}, NOV 19 2026</small>CPU Spiked to <strong>${vals.cpu}%</strong></div>`);
      }
    }

    setInterval(() => updateStats(false), 3000);
  </script>
</body>
</html>
